name: Release

# Changesets drives both halves of a release:
#   1. While changesets are pending on main, this opens (or updates) the "Version Packages" PR.
#   2. When that PR is merged there are none left, so the same step runs `pnpm release`, which
#      publishes the unpublished versions to npm with provenance (Sigstore). That half only runs once the
#      owner sets the repository variable NPM_PUBLISH=true; until then the run stops after the dry run (T123).
# changesets/action v2 reads the Changesets 3 layout: in pre mode the consumed changesets sit in
# .changeset/pre/ (v1 bundled the 2.x readers and failed on that directory).
# npm publishing is trusted publishing (BUILD-PLAN R84): npm (>= 11.5.1; pnpm 10 publishes through the
# npm CLI) swaps this job's GitHub OIDC token for a one-off publish token. No npm token is stored. Each
# package's trusted publisher on npmjs.com names semics-uk/emdash-plugins, release.yml and the
# npm-publish environment, so renaming this file or the environment breaks publishing until it is updated.
# The EmDash registry publish is a second, separate job that only runs once the owner enables it
# (repository variable EMDASH_REGISTRY_PUBLISH=true); every manifest names the real publisher DID
# (BUILD-PLAN R86).
#
# Owner setup (see CONTRIBUTING, "Releasing"): the `npm-publish` environment with required reviewers,
# a trusted publisher per package (`node scripts/npm-trust.mjs bootstrap --publish`, once), and the
# variables above.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version PR or npm publish
    # Only the public repository releases; a fork or the private Pro repo has nothing to publish here.
    if: github.repository == 'semics-uk/emdash-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: write # push the version branch
      pull-requests: write # open the Version Packages PR
      id-token: write # npm trusted publishing (OIDC) and provenance (Sigstore)
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check npm can publish by trusted publishing
        run: node scripts/npm-trust.mjs check-npm
      - name: Build and audit what would be published
        run: pnpm release:dry-run --build
      - name: Create the version PR or publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          # Empty until the owner sets NPM_PUBLISH=true: with nothing pending the action then publishes nothing.
          publish-script: ${{ vars.NPM_PUBLISH == 'true' && 'pnpm release' || '' }}
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  registry:
    name: Publish to the EmDash registry
    needs: release
    # Off until the owner sets EMDASH_REGISTRY_PUBLISH=true. The reusable workflow additionally
    # refuses any publisher but the semics DID (R86).
    if: needs.release.outputs.published == 'true' && vars.EMDASH_REGISTRY_PUBLISH == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/emdash-release.yml
    with:
      published-packages: ${{ needs.release.outputs.published-packages }}
