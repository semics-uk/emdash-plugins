name: Regenerate visual baselines

# Run by hand (T111): regenerates the T054 event card baselines on Linux CI, where the e2e job runs.
# The baselines were taken with macOS Chrome and pass on Linux within the 3% tolerance; if Linux fonts
# ever drift past it, run this once, download the artifact and commit its PNGs over
# apps/playground/e2e/__snapshots__/t054-events-list.spec.ts/ after reading the diff.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    name: T054 card baselines (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate the card baselines
        run: pnpm --filter playground e2e e2e/t054-events-list.spec.ts --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: t054-baselines-linux
          path: apps/playground/e2e/__snapshots__/t054-events-list.spec.ts/
          retention-days: 14
