name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  verify:
    name: pnpm verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The changeset check diffs against the base branch, which a pull request's checkout has no local copy of.
      - name: Fetch the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF:$BASE_REF"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # qpdf: the T016 PDF writer test checks its output with `qpdf --check` when qpdf is installed (T111).
      - name: Install qpdf
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qpdf
      - name: Run every quality gate
        run: pnpm verify

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Detect Playwright config
        id: playwright
        run: |
          # Either location is enough: `ls a b` fails when one of them is missing, which skipped e2e on every run.
          for f in playwright.config.* apps/playground/playwright.config.*; do
            if [ -e "$f" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; break; fi
          done
      # The playground suite uses the runner's system Chrome (`channel: "chrome"`), so no browser download.
      # `pnpm --filter playground e2e` builds the packages and the site, seeds, serves and runs Playwright.
      - name: Run end-to-end tests
        if: steps.playwright.outputs.present == 'true'
        run: pnpm --filter playground e2e
